name: Verify game
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Upload playable Vite build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-of-horrors-dist
          path: dist/
          retention-days: 14
